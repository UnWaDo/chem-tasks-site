{% extends "base.html" %}
{% block title %}Классы{% endblock %}
{% block content %}
<h1>Классы</h1>
<div class="grid2">
  <section class="card">
    <table class="table">
      <tr><th>Класс</th><th>Учеников</th></tr>
      {% for g in groups %}
        <tr><td><a href="{% url 'group_detail' g.pk %}">{{ g.name }}</a></td><td>{{ g.students.count }}</td></tr>
      {% empty %}<tr><td colspan="2" class="muted">Классов пока нет.</td></tr>{% endfor %}
    </table>
  </section>
  <section class="card">
    <h2>Новый класс</h2>
    <form method="post">{% csrf_token %}
      <label>Название (например, 10А или «Химия-профиль 2026»){{ form.name }}</label>
      {{ form.name.errors }}
      <button class="btn primary">Создать</button>
    </form>
  </section>
</div>
{% endblock %}
