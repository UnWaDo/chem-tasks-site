{# Выбор тэгов: all_tags, selected_tags (множество id), new_tags (строка) #}
<fieldset class="tag-picker">
  <legend>Тэги</legend>
  {% if all_tags %}
  <div class="tag-chips">
    {% for t in all_tags %}
      <label class="tag-chip"><input type="checkbox" name="tags" value="{{ t.pk }}" {% if t.pk in selected_tags %}checked{% endif %}><span>{{ t.name }}</span></label>
    {% endfor %}
  </div>
  {% endif %}
  <label class="small">Новые тэги через запятую
    <input name="new_tags" value="{{ new_tags }}" placeholder="например: ОВР, 9 класс, кислоты" autocomplete="off">
  </label>
  <a class="small" href="{% url 'tag_list' %}" target="_blank">Управление тэгами</a>
</fieldset>
