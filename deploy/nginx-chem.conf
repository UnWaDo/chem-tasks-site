# /etc/nginx/sites-available/chem  (затем: ln -s ../sites-available/chem /etc/nginx/sites-enabled/)
server {
    listen 80;
    server_name chem.example.ru;

    client_max_body_size 5m;

    location /static/ {
        alias /srv/chem/app/staticfiles/;
        expires 30d;
    }

    location / {
        proxy_pass http://unix:/run/chem/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
