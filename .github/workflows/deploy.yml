name: Deploy chem-tasks
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: chem
          POSTGRES_USER: chem
          POSTGRES_PASSWORD: ci-only
          POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --locale-provider=icu --icu-locale=ru-RU
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chem -d chem"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      POSTGRES_PASSWORD: ci-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - run: python manage.py collectstatic --noinput
        env:
          DJANGO_DEBUG: '0'
          DJANGO_SECRET_KEY: ci-only-static-assets

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote the tested commit from main
        run: |
          set -eu
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          git push origin HEAD:refs/heads/production
